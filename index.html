<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>تحدي الأرقام ✨</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family:"Tahoma","Segoe UI",system-ui,sans-serif;
    background:#0f172a; color:#e5e7eb;
    user-select:none; -webkit-user-select:none;
  }
  .screen { display:none; position:fixed; inset:0; width:100%; height:100%; }
  .screen.active { display:flex; flex-direction:column; }

  /* ---------------- عام ---------------- */
  .center-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
  .card-panel { width:100%; max-width:440px; text-align:center; }
  
  /* اللوجو والعنوان في الشاشة الرئيسية */
  .main-logo {
    width: 140px;
    height: auto;
    margin: 0 auto 12px;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }
  
  .card-panel h1 { font-size:24px; margin:0 0 6px; color:#f8fafc; font-weight: bold; }
  .card-panel p.sub { color:#94a3b8; font-size:13px; margin:0 0 20px; line-height:1.7; }
  .field { margin-bottom:12px; text-align:right; }
  .field label { display:block; font-size:12px; color:#94a3b8; margin-bottom:6px; }
  input[type="text"] {
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid #334155;
    background:#0b1220; color:#f1f5f9; font-size:16px; text-align:center; letter-spacing:1px;
  }
  input[type="text"]:focus { outline:2px solid #38bdf8; }
  select {
    width:100%; padding:10px; border-radius:10px; border:1px solid #334155;
    background:#0b1220; color:#f1f5f9; font-size:15px;
  }
  button.btn { padding:12px 16px; border-radius:10px; border:none; background:#334155; color:#f1f5f9; font-size:14px; cursor:pointer; }
  button.btn:active { transform:scale(.97); }
  button.primary { width:100%; padding:15px; border-radius:12px; border:none; background:#2563eb; color:#fff; font-size:16px; font-weight:bold; cursor:pointer; margin-top:8px; }
  button.primary:disabled { opacity:.4; }
  
  /* زر الدخول لغرفة باللون الذهبي الجذاب */
  button.btn-gold { 
    width:100%; padding:13px; border-radius:12px; border:1px solid #d97706; 
    background: linear-gradient(135deg, #b45309 0%, #d97706 100%); 
    color:#fff; font-size:15px; font-weight:bold; cursor:pointer; margin-top:10px; 
    box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25);
    transition: all 0.2s ease;
  }
  button.btn-gold:active { transform:scale(.97); opacity:0.9; }

  .status-msg { margin-top:12px; font-size:13px; color:#94a3b8; min-height:16px; line-height:1.6; }
  .status-msg.error { color:#f87171; }

  /* ---------------- شاشة الانتظار ---------------- */
  .room-code-big {
    font-size:34px; font-weight:bold; letter-spacing:6px; color:#38bdf8;
    background:#0b1220; border:1px dashed #334155; border-radius:14px; padding:16px; margin:14px 0; direction:ltr;
  }
  .player-list { list-style:none; padding:0; margin:14px 0; text-align:right; }
  .player-list li {
    display:flex; align-items:center; justify-content:space-between;
    background:#1e293b; border-radius:10px; padding:10px 14px; margin-bottom:8px; font-size:14px;
  }
  .player-list li .crown { color:#facc15; margin-left:6px; }
  .target-row { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:10px; }
  .target-row label { font-size:13px; color:#94a3b8; white-space:nowrap; }

  /* ---------------- شاشة اللعب ---------------- */
  #screen-game { background:#0f172a; }
  .game-top {
    flex: 1;
    display:flex; flex-direction:row;
    min-height:0;
    padding-top:24px;
  }
  .side-col {
    width:75px; flex:0 0 75px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    padding:2px;
  }
  .side-label { font-size:9px; color:#64748b; text-align:center; }
  .stack-visual { width:52px; aspect-ratio:2/3; position:relative; }
  #deck-count-badge {
    position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
    background:#0b1220; border:1px solid #334155; border-radius:10px; font-size:9px; padding:1px 5px; color:#cbd5e1; z-index:2;
  }
  #burn-pile { width:52px; aspect-ratio:2/3; border-radius:6px; border:2px dashed #334155; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  #burn-pile.hot { outline:3px solid #ef4444; box-shadow:0 0 14px #ef4444; cursor:pointer; }

  .center-grid {
    flex:1; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    gap:3px; padding:2px; direction:ltr; min-width:0; align-items:center; justify-items:center;
  }
  .grid-cell { position:relative; border-radius:6px; width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .grid-cell .card { width:100%; height:100%; aspect-ratio:2/3; }

  .right-col {
    width:90px; flex:0 0 90px;
    padding:4px; overflow-y:auto;
  }
  .player-tag {
    display:flex; align-items:center; gap:4px;
    background:#1e293b; border-radius:6px; padding:4px 6px; margin-bottom:4px; font-size:10px;
  }
  .player-tag .lamp { width:7px; height:7px; border-radius:50%; background:#334155; flex:0 0 7px; }
  .player-tag.active .lamp { background:#22c55e; box-shadow:0 0 8px #22c55e; }
  .player-tag .p-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .player-tag .p-score { color:#94a3b8; font-size:9px; }
  .player-tag.disconnected { opacity:.4; }

  .game-bottom {
    flex: 1.3; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#111827; padding:4px; min-height:0;
  }
  
  .my-board {
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    gap:4px; width:min(42vh,80vw,290px); height:min(63vh,120vw,435px); direction:ltr;
  }
  .board-cell {
    border-radius:6px; border:2px dashed #334155; display:flex; align-items:center; justify-content:center;
    font-size:1.3em; font-weight:bold; color:#475569; position:relative; overflow:hidden; aspect-ratio:2/3; width:100%; height:100%;
  }
  .board-cell.filled { border-style:solid; border-color:transparent; }
  .board-cell.highlight-green { outline:3px solid #22c55e; box-shadow:0 0 14px #22c55e; cursor:pointer; border-color:#22c55e; }

  .card {
    border-radius:6px; display:flex; align-items:center; justify-content:center;
    position:relative; background-size:contain; background-position:center; background-repeat:no-repeat;
    box-shadow:0 2px 5px rgba(0,0,0,.4); width:100%; height:100%;
  }
  .card.back { cursor:pointer; }
  .card.back.disabled { cursor:default; opacity:.65; }
  .fly-clone { z-index:999; pointer-events:none; background-size:contain; background-position:center; background-repeat:no-repeat; }

  @keyframes revealPop { from{ transform:scale(.6) rotateY(100deg); opacity:.3; } to{ transform:scale(1) rotateY(0); opacity:1; } }
  .grid-cell.just-revealed .card { animation: revealPop .4s ease; }

  /* ---------------- نافذة النقاط ---------------- */
  #round-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:30;
    align-items:center; justify-content:center; padding:20px;
  }
  #round-overlay.active { display:flex; }
  .round-box { background:#111827; border-radius:16px; padding:22px; width:100%; max-width:380px; text-align:center; }
  .round-box h2 { margin:0 0 6px; font-size:19px; color:#facc15; }
  .round-box p.winner-name { margin:0 0 16px; font-size:15px; color:#e2e8f0; }
  .score-table { width:100%; border-collapse:collapse; margin-bottom:16px; }
  .score-table td { padding:8px; border-bottom:1px solid #1f2937; font-size:13px; text-align:right; }
  .score-table td:last-child { text-align:left; font-weight:bold; color:#38bdf8; }

  .top-bar-game {
    position:fixed; top:4px; left:0; right:0; display:flex; justify-content:space-between; padding:0 10px; z-index:5; pointer-events:none;
  }
  .top-bar-game .pill { pointer-events:auto; background:rgba(0,0,0,.4); color:#e2e8f0; font-size:10px; padding:4px 8px; border-radius:12px; }
</style>
</head>
<body>

<div id="app">

  <!-- ============ الشاشة الرئيسية ============ -->
  <div id="screen-home" class="screen active">
    <div class="center-wrap">
      <div class="card-panel">
        <img src="https://raw.githubusercontent.com/Jawlah1/UNOcards/main/LOGO.png" alt="Logo" class="main-logo">
        <h1>تحدي الأرقام ✨</h1>
        <p class="sub">اجمع الأرقام من 1 إلى 9 في لوحتك قبل بقية اللاعبين. من 2 إلى 6 لاعبين.</p>
        <div class="field">
          <label>اسمك</label>
          <input type="text" id="player-name" placeholder="اكتب اسمك" maxlength="16">
        </div>
        <button class="primary" id="btn-create-room">إنشاء غرفة جديدة</button>
        <button class="btn-gold" id="btn-show-join">الدخول إلى غرفة</button>

        <div id="join-box" style="display:none;">
          <div class="field" style="margin-top:14px;">
            <label>رمز الغرفة</label>
            <input type="text" id="room-code-input" placeholder="مثال: AB3D" maxlength="8">
          </div>
          <button class="primary" id="btn-join-room">دخول</button>
        </div>

        <div class="status-msg" id="home-status"></div>
      </div>
    </div>
  </div>

  <!-- ============ شاشة الانتظار ============ -->
  <div id="screen-lobby" class="screen">
    <div class="center-wrap">
      <div class="card-panel">
        <h1>غرفة الانتظار</h1>
        <p class="sub">شارك هذا الرمز مع بقية اللاعبين</p>
        <div class="room-code-big" id="lobby-room-code">----</div>

        <div class="target-row">
          <label>عدد اللاعبين المستهدف:</label>
          <select id="target-count-select" disabled>
            <option value="2">2</option><option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option>
          </select>
        </div>

        <ul class="player-list" id="lobby-players"></ul>

        <button class="primary" id="btn-start-game" style="display:none;" disabled>بدء اللعبة</button>
        <div class="status-msg" id="lobby-status">بانتظار المضيف لبدء اللعبة...</div>
      </div>
    </div>
  </div>

  <!-- ============ شاشة اللعب ============ -->
  <div id="screen-game" class="screen">
    <div class="top-bar-game"><div class="pill" id="round-badge">جولة اللعب</div></div>

    <div class="game-top">
      <div class="side-col">
        <div class="side-label">مجموعة السحب</div>
        <div class="stack-visual">
          <div class="card back" id="deck-card-back" style="width:100%;height:100%;"></div>
          <div id="deck-count-badge">--</div>
        </div>
        <div class="side-label">منطقة الحرق</div>
        <div id="burn-pile"></div>
      </div>

      <div class="center-grid" id="shared-grid"></div>

      <div class="right-col" id="players-panel"></div>
    </div>

    <div class="game-bottom">
      <div class="my-board" id="my-board"></div>
    </div>
  </div>

</div>

<!-- ============ نافذة نتيجة الجولة ============ -->
<div id="round-overlay">
  <div class="round-box">
    <h2 id="round-title">انتهت الجولة!</h2>
    <p class="winner-name" id="round-winner-name"></p>
    <table class="score-table" id="round-score-table"></table>
    <button class="primary" id="btn-new-round" style="display:none;">جولة جديدة</button>
    <div class="status-msg" id="round-status">بانتظار المضيف لبدء جولة جديدة...</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ==================================================================
  // إدارة صور البطاقات واللوجو من GitHub
  // ==================================================================
  var GITHUB_RAW_BASE = 'https://raw.githubusercontent.com/Jawlah1/UNOcards/main/';
  
  var COLOR_MAP = {
    'blue': 'B',
    'yellow': 'Y',
    'green': 'G',
    'red': 'R'
  };

  function getCardImageUrl(card) {
    if (!card) return GITHUB_RAW_BASE + 'CARD%20BACK.png';
    
    // بطاقات الجوكر السحرية
    if (card.color === 'wild') {
      if (card.value === 'wild4') return GITHUB_RAW_BASE + 'PLUS4.png';
      return GITHUB_RAW_BASE + 'CHANGE%20COLOR.png';
    }

    var prefix = COLOR_MAP[card.color] || 'B';
    
    // استخدام الشرطة الصغيرة (-) لبطاقات الأكشن
    if (card.value === 'skip') return GITHUB_RAW_BASE + prefix + '-SKIP.png';
    if (card.value === 'reverse') return GITHUB_RAW_BASE + prefix + '-FLIP.png';
    if (card.value === 'draw2') return GITHUB_RAW_BASE + prefix + '-PLUS2.png';

    // البطاقات الرقمية من 0 إلى 9
    return GITHUB_RAW_BASE + prefix + card.value + '.png';
  }

  function getCardBackUrl() {
    return GITHUB_RAW_BASE + 'CARD%20BACK.png';
  }

  // التحميل المسبق للصور بما فيها اللوجو
  function preloadImages() {
    var imagesToPreload = ['CARD%20BACK.png', 'CHANGE%20COLOR.png', 'PLUS4.png', 'LOGO.png'];
    ['B','Y','G','R'].forEach(function(c){
      for(var i=0; i<=9; i++) imagesToPreload.push(c + i + '.png');
      imagesToPreload.push(c + '-SKIP.png');
      imagesToPreload.push(c + '-FLIP.png');
      imagesToPreload.push(c + '-PLUS2.png');
    });
    imagesToPreload.forEach(function(imgName){
      var img = new Image();
      img.src = GITHUB_RAW_BASE + imgName;
    });
  }
  preloadImages();

  // ==================================================================
  // أدوات البطاقات
  // ==================================================================
  var COLORS = ['red','yellow','green','blue'];

  function makeCard(color, value){
    return { id: color + '-' + value + '-' + Math.random().toString(36).slice(2,8), color: color, value: value };
  }

  function buildDeck(){
    var deck = [];
    COLORS.forEach(function(c){
      deck.push(makeCard(c, '0'));
      for(var n=1;n<=9;n++){ deck.push(makeCard(c, String(n))); deck.push(makeCard(c, String(n))); }
      ['skip','reverse','draw2'].forEach(function(a){ deck.push(makeCard(c,a)); deck.push(makeCard(c,a)); });
    });
    for(var i=0;i<4;i++){ deck.push(makeCard('wild','wild')); deck.push(makeCard('wild','wild4')); }
    return shuffle(deck);
  }

  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random() * (i+1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // ==================================================================
  // مراجع DOM
  // ==================================================================
  var els = {
    playerName: document.getElementById('player-name'),
    btnCreateRoom: document.getElementById('btn-create-room'),
    btnShowJoin: document.getElementById('btn-show-join'),
    joinBox: document.getElementById('join-box'),
    roomCodeInput: document.getElementById('room-code-input'),
    btnJoinRoom: document.getElementById('btn-join-room'),
    homeStatus: document.getElementById('home-status'),

    lobbyRoomCode: document.getElementById('lobby-room-code'),
    targetCountSelect: document.getElementById('target-count-select'),
    lobbyPlayers: document.getElementById('lobby-players'),
    btnStartGame: document.getElementById('btn-start-game'),
    lobbyStatus: document.getElementById('lobby-status'),

    roundBadge: document.getElementById('round-badge'),
    deckCountBadge: document.getElementById('deck-count-badge'),
    deckCardBack: document.getElementById('deck-card-back'),
    burnPileEl: document.getElementById('burn-pile'),
    sharedGrid: document.getElementById('shared-grid'),
    playersPanel: document.getElementById('players-panel'),
    myBoard: document.getElementById('my-board'),

    roundOverlay: document.getElementById('round-overlay'),
    roundTitle: document.getElementById('round-title'),
    roundWinnerName: document.getElementById('round-winner-name'),
    roundScoreTable: document.getElementById('round-score-table'),
    btnNewRound: document.getElementById('btn-new-round'),
    roundStatus: document.getElementById('round-status')
  };

  els.deckCardBack.style.backgroundImage = 'url("' + getCardBackUrl() + '")';

  function showScreen(id){
    ['screen-home','screen-lobby','screen-game'].forEach(function(s){
      document.getElementById(s).classList.toggle('active', s === id);
    });
  }

  // ==================================================================
  // حالة التطبيق
  // ==================================================================
  var app = {
    peer: null,
    isHost: false,
    myPlayerId: null,
    connections: [],   
    hostConn: null,    
    state: null        
  };

  var game = null;
  var ROOM_PREFIX = 'unoboard37-';

  // ==================================================================
  // الشاشة الرئيسية
  // ==================================================================
  els.btnShowJoin.addEventListener('click', function(){
    els.joinBox.style.display = els.joinBox.style.display === 'none' ? 'block' : 'none';
  });

  function setHomeStatus(msg, isError){
    els.homeStatus.textContent = msg;
    els.homeStatus.classList.toggle('error', !!isError);
  }

  function getPlayerName(){
    var n = els.playerName.value.trim();
    if(!n) n = 'لاعب' + Math.floor(Math.random()*90+10);
    return n.slice(0,16);
  }

  els.btnCreateRoom.addEventListener('click', function(){
    els.btnCreateRoom.disabled = true;
    setHomeStatus('جاري إنشاء الغرفة...', false);
    createRoomFlow(getPlayerName());
  });

  els.btnJoinRoom.addEventListener('click', function(){
    var code = els.roomCodeInput.value.trim();
    if(!code){ setHomeStatus('أدخل رمز الغرفة', true); return; }
    els.btnJoinRoom.disabled = true;
    setHomeStatus('جاري البحث عن الغرفة...', false);
    joinRoomFlow(code, getPlayerName());
  });

  // ==================================================================
  // إنشاء غرفة (المضيف)
  // ==================================================================
  function createRoomFlow(name){
    var code = Math.random().toString(36).substring(2,6).toUpperCase();
    var hostId = ROOM_PREFIX + code.toLowerCase() + '-host';

    var peer = new Peer(hostId, { debug: 0 });
    app.peer = peer;
    app.isHost = true;
    app.connections = [];

    peer.on('open', function(){
      app.myPlayerId = hostId;
      game = {
        code: code,
        players: [ { id: hostId, name: name, score: 0, board: null, connected: true } ],
        targetCount: 4,
        started: false,
        deck: [],
        grid: [],
        burnPile: [],
        currentPlayerIndex: 0,
        phase: 'lobby',
        pendingSlot: null,
        canPlace: null,
        winnerId: null
      };
      broadcastState(null);
    });

    peer.on('connection', function(conn){
      conn.on('open', function(){ app.connections.push(conn); });
      conn.on('data', function(msg){ handleHostReceivedMessage(msg, conn.peer, conn); });
      conn.on('close', function(){ handlePlayerLeft(conn.peer); });
    });

    peer.on('error', function(err){
      setHomeStatus('تعذر إنشاء الغرفة (' + err.type + ')، حاول مرة أخرى.', true);
      els.btnCreateRoom.disabled = false;
    });
  }

  // ==================================================================
  // الانضمام لغرفة (العميل)
  // ==================================================================
  function joinRoomFlow(codeRaw, name){
    var code = codeRaw.trim().toLowerCase();
    var hostId = ROOM_PREFIX + code + '-host';

    var peer = new Peer(undefined, { debug: 0 });
    app.peer = peer;
    app.isHost = false;

    peer.on('open', function(){
      var conn = peer.connect(hostId, { reliable: true });
      app.hostConn = conn;

      conn.on('open', function(){
        conn.send({ t: 'join', name: name });
      });

      conn.on('data', function(msg){
        if(msg.t === 'welcome'){
          app.myPlayerId = msg.myId;
          setHomeStatus('', false);
        } else if(msg.t === 'room-full'){
          alert('الغرفة ممتلئة (وصلت للحد الأقصى 6 لاعبين).');
          location.reload();
        } else if(msg.t === 'game-started'){
          alert('اللعبة بدأت بالفعل في هذه الغرفة، لا يمكن الانضمام الآن.');
          location.reload();
        } else if(msg.t === 'state'){
          handleIncomingState(msg);
        }
      });

      conn.on('close', function(){
        alert('انقطع الاتصال بالمضيف. انتهت الجلسة.');
        location.reload();
      });
    });

    peer.on('error', function(err){
      if(err.type === 'peer-unavailable'){
        setHomeStatus('لم يتم العثور على غرفة بهذا الرمز.', true);
      } else {
        setHomeStatus('تعذر الاتصال (' + err.type + ')، حاول مرة أخرى.', true);
      }
      els.btnJoinRoom.disabled = false;
    });
  }

  // ==================================================================
  // منطق المضيف
  // ==================================================================
  function handleHostReceivedMessage(msg, fromId, conn){
    if(msg.t === 'join'){
      hostAddPlayer(fromId, msg.name, conn);
    } else if(msg.t === 'reveal'){
      hostReveal(fromId, msg.slot);
    } else if(msg.t === 'resolve'){
      hostResolve(fromId, msg.choice);
    }
  }

  function hostAddPlayer(id, name, conn){
    if(game.players.length >= 6){
      conn.send({ t: 'room-full' });
      setTimeout(function(){ conn.close(); }, 300);
      return;
    }
    if(game.started){
      conn.send({ t: 'game-started' });
      setTimeout(function(){ conn.close(); }, 300);
      return;
    }
    game.players.push({ id: id, name: name || ('لاعب' + Math.floor(Math.random()*90+10)), score: 0, board: null, connected: true });
    conn.send({ t: 'welcome', myId: id });
    broadcastState(null);
  }

  function handlePlayerLeft(id){
    if(!game) return;
    var p = game.players.filter(function(pl){ return pl.id === id; })[0];
    if(p) p.connected = false;
    app.connections = app.connections.filter(function(c){ return c.peer !== id; });
    if(game.started && game.phase !== 'round-over'){
      var currentId = game.players[game.currentPlayerIndex].id;
      if(currentId === id){
        advanceTurn();
        broadcastState(null);
        return;
      }
    }
    broadcastState(null);
  }

  function nextConnectedIndex(fromIdx){
    var n = game.players.length;
    var idx = fromIdx;
    for(var i=0;i<n;i++){
      idx = (idx + 1) % n;
      if(game.players[idx].connected) return idx;
    }
    return (fromIdx + 1) % n;
  }

  function advanceTurn(){
    game.currentPlayerIndex = nextConnectedIndex(game.currentPlayerIndex);
    game.phase = 'select';
    game.pendingSlot = null;
    game.canPlace = null;
  }

  function hostStartGame(){
    if(!game || game.players.length < 2) return;
    game.deck = buildDeck();
    game.burnPile = [];
    game.players.forEach(function(p){
      p.board = { '1':null,'2':null,'3':null,'4':null,'5':null,'6':null,'7':null,'8':null,'9':null };
    });
    game.grid = [];
    for(var i=0;i<9;i++){ game.grid.push({ card: game.deck.pop(), revealed:false }); }
    game.currentPlayerIndex = 0;
    game.phase = 'select';
    game.pendingSlot = null;
    game.canPlace = null;
    game.started = true;
    game.winnerId = null;
    broadcastState({ type: 'game-start' });
  }

  function drawFromDeck(){
    if(game.deck.length === 0){
      if(game.burnPile.length <= 1){
        game.deck = buildDeck();
      } else {
        var top = game.burnPile.pop();
        game.deck = shuffle(game.burnPile);
        game.burnPile = [top];
      }
    }
    return game.deck.pop();
  }

  function hostReveal(playerId, slot){
    if(!game || game.phase !== 'select') return;
    if(game.players[game.currentPlayerIndex].id !== playerId) return;
    var cell = game.grid[slot];
    if(!cell || cell.revealed || !cell.card) return;

    cell.revealed = true;
    var val = cell.card.value;
    var current = game.players[game.currentPlayerIndex];
    var canPlace = /^[1-9]$/.test(val) && current.board[val] === null;

    game.phase = 'choice';
    game.pendingSlot = slot;
    game.canPlace = canPlace;

    broadcastState({ type: 'revealed', slot: slot });
  }

  function hostResolve(playerId, choice){
    if(!game || game.phase !== 'choice') return;
    var pi = game.currentPlayerIndex;
    var current = game.players[pi];
    if(current.id !== playerId) return;
    if(choice === 'place' && !game.canPlace) return;

    var slot = game.pendingSlot;
    var card = game.grid[slot].card;
    var won = false;

    if(choice === 'place'){
      current.board[card.value] = card;
      won = Object.keys(current.board).every(function(k){ return current.board[k] !== null; });
    } else {
      game.burnPile.push(card);
    }

    var evt = { type: 'resolved', slot: slot, choice: choice, playerId: playerId };

    if(won){
      finishRound(current.id);
      broadcastState(evt);
      return;
    }

    game.grid[slot] = { card: drawFromDeck(), revealed: false };
    advanceTurn();
    broadcastState(evt);
  }

  function finishRound(winnerId){
    game.players.forEach(function(p){
      if(p.id === winnerId){
        p.score += 100;
      } else {
        var sum = 0;
        Object.keys(p.board).forEach(function(k){ if(p.board[k] !== null) sum += Number(k); });
        p.score += sum;
      }
    });
    game.phase = 'round-over';
    game.winnerId = winnerId;
  }

  function sanitizeStateForClients(){
    return {
      code: game.code,
      players: game.players.map(function(p){
        return { id: p.id, name: p.name, score: p.score, board: p.board, connected: p.connected };
      }),
      targetCount: game.targetCount,
      started: game.started,
      deckCount: game.deck.length,
      grid: game.grid.map(function(c){
        return c.revealed ? { card: c.card, revealed: true } : { card: null, revealed: false };
      }),
      burnPile: game.burnPile.length ? [ game.burnPile[game.burnPile.length - 1] ] : [],
      currentPlayerIndex: game.currentPlayerIndex,
      phase: game.phase,
      pendingSlot: game.pendingSlot,
      canPlace: game.canPlace,
      winnerId: game.winnerId || null
    };
  }

  function broadcastState(event){
    var payload = { t: 'state', event: event, state: sanitizeStateForClients() };
    app.connections.forEach(function(conn){ if(conn.open) conn.send(payload); });
    handleIncomingState(payload);
  }

  // ==================================================================
  // استقبال الحالة وعرضها
  // ==================================================================
  function handleIncomingState(payload){
    var oldState = app.state;
    var event = payload.event;
    var newState = payload.state;

    if(event && event.type === 'resolved' && oldState && oldState.started){
      var slotEl = document.querySelector('.grid-cell[data-slot="' + event.slot + '"]');
      var sourceRect = slotEl ? slotEl.getBoundingClientRect() : null;
      var card = oldState.grid[event.slot] && oldState.grid[event.slot].card;

      app.state = newState;
      renderAll();

      if(sourceRect && card){
        var destEl = null;
        if(event.choice === 'burn'){
          destEl = els.burnPileEl;
        } else if(event.playerId === app.myPlayerId){
          destEl = document.querySelector('.my-board .board-cell[data-key="' + card.value + '"]');
        } else {
          destEl = document.querySelector('.player-tag[data-id="' + event.playerId + '"]');
        }
        if(destEl){ flyClone(card, sourceRect, destEl.getBoundingClientRect()); }
      }
      return;
    }

    app.state = newState;
    renderAll();

    if(event && event.type === 'revealed'){
      var el = document.querySelector('.grid-cell[data-slot="' + event.slot + '"]');
      if(el){
        el.classList.add('just-revealed');
        setTimeout(function(){ el.classList.remove('just-revealed'); }, 450);
      }
    }
  }

  function flyClone(card, fromRect, toRect){
    var clone = document.createElement('div');
    clone.className = 'card fly-clone';
    clone.style.backgroundImage = 'url("' + getCardImageUrl(card) + '")';
    clone.style.position = 'fixed';
    clone.style.left = fromRect.left + 'px';
    clone.style.top = fromRect.top + 'px';
    clone.style.width = fromRect.width + 'px';
    clone.style.height = fromRect.height + 'px';
    document.body.appendChild(clone);
    
    requestAnimationFrame(function(){
      clone.style.transition = 'transform .55s cubic-bezier(.3,.6,.3,1), opacity .55s';
      var dx = (toRect.left + toRect.width/2) - (fromRect.left + fromRect.width/2);
      var dy = (toRect.top + toRect.height/2) - (fromRect.top + fromRect.height/2);
      var scale = Math.max(0.2, Math.min(1, toRect.width / fromRect.width));
      clone.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + scale + ')';
      clone.style.opacity = '0.2';
    });
    setTimeout(function(){ clone.remove(); }, 600);
  }

  // ==================================================================
  // العرض
  // ==================================================================
  function renderAll(){
    var st = app.state;
    if(!st) return;
    if(!st.started){
      renderLobby(st);
      showScreen('screen-lobby');
      els.roundOverlay.classList.remove('active');
    } else {
      renderGame(st);
      showScreen('screen-game');
    }
  }

  function renderLobby(st){
    els.lobbyRoomCode.textContent = st.code;
    els.targetCountSelect.value = String(st.targetCount);
    els.targetCountSelect.disabled = !app.isHost;

    els.lobbyPlayers.innerHTML = '';
    st.players.forEach(function(p, idx){
      var li = document.createElement('li');
      li.innerHTML = '<span>' + (idx === 0 ? '<span class="crown">♛</span>' : '') + escapeHtml(p.name) + '</span><span></span>';
      els.lobbyPlayers.appendChild(li);
    });

    if(app.isHost){
      els.btnStartGame.style.display = 'block';
      els.btnStartGame.disabled = st.players.length < 2;
      els.lobbyStatus.textContent = st.players.length < 2 ? 'بانتظار لاعب واحد إضافي على الأقل...' : 'يمكنك بدء اللعبة الآن.';
    } else {
      els.btnStartGame.style.display = 'none';
      els.lobbyStatus.textContent = 'بانتظار المضيف لبدء اللعبة... (' + st.players.length + ' لاعبين حاليًا)';
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function renderGame(st){
    var me = st.players.filter(function(p){ return p.id === app.myPlayerId; })[0];
    var currentPlayer = st.players[st.currentPlayerIndex];
    var isMyTurn = currentPlayer && currentPlayer.id === app.myPlayerId;

    els.roundBadge.textContent = isMyTurn ? 'دورك الآن!' : ('دور: ' + (currentPlayer ? currentPlayer.name : ''));
    els.deckCountBadge.textContent = st.deckCount;

    var burnTop = st.burnPile[0] || null;
    els.burnPileEl.innerHTML = '';
    if(burnTop){
      var bc = document.createElement('div');
      bc.className = 'card';
      bc.style.backgroundImage = 'url("' + getCardImageUrl(burnTop) + '")';
      bc.style.width = '100%'; bc.style.height = '100%';
      els.burnPileEl.appendChild(bc);
    }
    var burnActive = isMyTurn && st.phase === 'choice';
    els.burnPileEl.classList.toggle('hot', burnActive);
    els.burnPileEl.onclick = burnActive ? function(){ submitAction({ t:'resolve', choice:'burn' }); } : null;

    els.sharedGrid.innerHTML = '';
    st.grid.forEach(function(cell, i){
      var wrap = document.createElement('div');
      wrap.className = 'grid-cell';
      wrap.setAttribute('data-slot', i);
      var c = document.createElement('div');
      if(cell.revealed && cell.card){
        c.className = 'card';
        c.style.backgroundImage = 'url("' + getCardImageUrl(cell.card) + '")';
      } else {
        c.className = 'card back' + ((isMyTurn && st.phase === 'select') ? '' : ' disabled');
        c.style.backgroundImage = 'url("' + getCardBackUrl() + '")';
        if(isMyTurn && st.phase === 'select'){
          c.onclick = (function(slot){ return function(){ submitAction({ t:'reveal', slot: slot }); }; })(i);
        }
      }
      wrap.appendChild(c);
      els.sharedGrid.appendChild(wrap);
    });

    els.playersPanel.innerHTML = '';
    st.players.forEach(function(p){
      var tag = document.createElement('div');
      tag.className = 'player-tag' + (p.id === currentPlayer.id ? ' active' : '') + (p.connected === false ? ' disconnected' : '');
      tag.setAttribute('data-id', p.id);
      tag.innerHTML = '<span class="lamp"></span><span class="p-name">' + escapeHtml(p.name) + '</span><span class="p-score">' + p.score + '</span>';
      els.playersPanel.appendChild(tag);
    });

    els.myBoard.innerHTML = '';
    var pendingCard = (st.phase === 'choice' && st.pendingSlot != null) ? (st.grid[st.pendingSlot] && st.grid[st.pendingSlot].card) : null;
    for(var n=1;n<=9;n++){
      var key = String(n);
      var cell = document.createElement('div');
      cell.className = 'board-cell';
      cell.setAttribute('data-key', key);
      var filledCard = me && me.board ? me.board[key] : null;
      if(filledCard){
        cell.classList.add('filled');
        var fc = document.createElement('div');
        fc.className = 'card';
        fc.style.backgroundImage = 'url("' + getCardImageUrl(filledCard) + '")';
        fc.style.width = '100%'; fc.style.height = '100%';
        cell.appendChild(fc);
      } else {
        cell.textContent = key;
        var canHighlight = isMyTurn && st.phase === 'choice' && st.canPlace && pendingCard && pendingCard.value === key;
        if(canHighlight){
          cell.classList.add('highlight-green');
          cell.onclick = function(){ submitAction({ t:'resolve', choice:'place' }); };
        }
      }
      els.myBoard.appendChild(cell);
    }

    if(st.phase === 'round-over'){
      showRoundOverlay(st);
    } else {
      els.roundOverlay.classList.remove('active');
    }
  }

  function showRoundOverlay(st){
    var winner = st.players.filter(function(p){ return p.id === st.winnerId; })[0];
    els.roundWinnerName.textContent = winner ? ('🏆 الفائز: ' + winner.name) : '';
    var sorted = st.players.slice().sort(function(a,b){ return b.score - a.score; });
    els.roundScoreTable.innerHTML = '';
    sorted.forEach(function(p){
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + escapeHtml(p.name) + (p.id === st.winnerId ? ' 🏆' : '') + '</td><td>' + p.score + '</td>';
      els.roundScoreTable.appendChild(tr);
    });
    if(app.isHost){
      els.btnNewRound.style.display = 'block';
      els.roundStatus.textContent = '';
    } else {
      els.btnNewRound.style.display = 'none';
      els.roundStatus.textContent = 'بانتظار المضيف لبدء جولة جديدة...';
    }
    els.roundOverlay.classList.add('active');
  }

  // ==================================================================
  // إرسال الأفعال
  // ==================================================================
  function submitAction(action){
    if(app.isHost){
      if(action.t === 'reveal') hostReveal(app.myPlayerId, action.slot);
      else if(action.t === 'resolve') hostResolve(app.myPlayerId, action.choice);
    } else if(app.hostConn && app.hostConn.open){
      app.hostConn.send(action);
    }
  }

  // ==================================================================
  // الأحداث
  // ==================================================================
  els.targetCountSelect.addEventListener('change', function(){
    if(app.isHost && game){
      game.targetCount = parseInt(els.targetCountSelect.value, 10);
      broadcastState(null);
    }
  });

  els.btnStartGame.addEventListener('click', function(){
    if(app.isHost) hostStartGame();
  });

  els.btnNewRound.addEventListener('click', function(){
    if(app.isHost) hostStartGame();
  });

})();
</script>
